<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.33" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- malé bubliny pro radost -->
  <circle cx="132" cy="142" r="30" fill="#22c55e"/>
  <circle cx="132" cy="142" r="30" fill="url(#shine)"/>
  <circle cx="380" cy="368" r="26" fill="#f59e0b"/>
  <circle cx="380" cy="368" r="26" fill="url(#shine)"/>
  <!-- násobení -->
  <circle cx="205" cy="300" r="100" fill="#ec4899"/>
  <circle cx="205" cy="300" r="100" fill="url(#shine)"/>
  <g transform="translate(205 300) rotate(45)" fill="#fff">
    <rect x="-15" y="-58" width="30" height="116" rx="15"/>
    <rect x="-58" y="-15" width="116" height="30" rx="15"/>
  </g>
  <!-- dělení (dvojtečka, jak ve škole) -->
  <circle cx="352" cy="176" r="74" fill="#0ea5e9"/>
  <circle cx="352" cy="176" r="74" fill="url(#shine)"/>
  <circle cx="352" cy="150" r="14" fill="#fff"/>
  <circle cx="352" cy="202" r="14" fill="#fff"/>
</svg>
